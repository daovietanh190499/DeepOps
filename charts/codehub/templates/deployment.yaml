apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "codehub.fullname" . }}
  labels:
    {{- include "codehub.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "codehub.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "codehub.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{- if or .Values.sidecars.always .Values.monitor.enabled }} {{ include "codehub.sidecarServiceAccountName" . }}{{- else }} {{ include "codehub.serviceAccountName" . }}{{- end }}
      {{- if or .Values.sidecars.always .Values.monitor.enabled }}
      automountServiceAccountToken: false
      {{- end }}
      terminationGracePeriodSeconds: 30
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- $userInit := .Values.userInitContainer | default dict }}
      {{- if $userInit.enabled }}
      initContainers:
        - name: user-init
          image: "{{ $userInit.image.repository }}:{{ $userInit.image.tag }}"
          imagePullPolicy: {{ $userInit.image.pullPolicy | default "IfNotPresent" }}
          {{- if .Values.env.secret }}
          envFrom:
            - secretRef:
                name: {{ .Values.secret.name }}
          {{- end }}
          {{- with .Values.extraEnv }}
          env:
            {{- range . }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
          {{- end }}
          {{- with $userInit.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- include "codehub.containerVolumeMounts" . | nindent 12 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.env.secret }}
          envFrom:
            - secretRef:
                name: {{ .Values.secret.name }}
          {{- end }}
          {{- with .Values.extraEnv }}
          env:
            {{- range . }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
          {{- end }}
          {{- $container := .Values.container | default dict }}
          {{- if $container.command }}
          command:
            {{- toYaml $container.command | nindent 12 }}
          {{- end }}
          {{- if $container.args }}
          args:
            {{- toYaml $container.args | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            {{- range .Values.service.extraPorts }}
            - name: {{ .name }}
              containerPort: {{ .port }}
              protocol: TCP
            {{- end }}
          {{- $resources := deepCopy .Values.resources }}
          {{- if .Values.gpu.enabled }}
          {{- $_ := set $resources.limits "nvidia.com/gpu" (.Values.gpu.count | int) }}
          {{- $_ := set $resources.requests "nvidia.com/gpu" (.Values.gpu.count | int) }}
          {{- if gt (int .Values.gpu.memoryMiB) 0 }}
          {{- $_ := set $resources.limits "nvidia.com/gpumem" (.Values.gpu.memoryMiB | int) }}
          {{- $_ := set $resources.requests "nvidia.com/gpumem" (.Values.gpu.memoryMiB | int) }}
          {{- end }}
          {{- end }}
          resources:
            {{- toYaml $resources | nindent 12 }}
          volumeMounts:
            {{- include "codehub.containerVolumeMounts" . | nindent 12 }}
        {{- if or .Values.sidecars.always .Values.portTunnel.enabled }}
        - name: port-tunnel
          image: "{{ .Values.portTunnel.image.repository }}:{{ .Values.portTunnel.image.tag }}"
          imagePullPolicy: {{ .Values.portTunnel.image.pullPolicy }}
          ports:
            - name: port-ws
              containerPort: {{ .Values.portTunnel.wsPort }}
              protocol: TCP
          env:
            - name: WS_PORT
              value: {{ .Values.portTunnel.wsPort | quote }}
            - name: WS_PATH_PREFIX
              value: {{ .Values.portTunnel.pathPrefix | default "port-tunnel" | quote }}
            - name: TARGET_HOST
              value: {{ .Values.portTunnel.targetHost | default "127.0.0.1" | quote }}
            - name: TUNNEL_PORTS
              value: {{ join "," (.Values.portTunnel.ports | default list) | quote }}
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: sidecar-config
              mountPath: /config/sidecar
              readOnly: true
        {{- end }}
        {{- if or .Values.sidecars.always .Values.monitor.enabled }}
        - name: monitor-sidecar
          image: "{{ .Values.monitor.image.repository }}:{{ .Values.monitor.image.tag }}"
          imagePullPolicy: {{ .Values.monitor.image.pullPolicy }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: TARGET_CONTAINER
              value: {{ .Values.monitor.targetContainer | default .Chart.Name | quote }}
            - name: GPU_ENABLED
              value: {{ .Values.gpu.enabled | quote }}
            - name: CPU_LIMIT_MILLICORES
              value: {{ .Values.monitor.cpuLimitMillicores | default 2000 | quote }}
            - name: MEMORY_LIMIT_BYTES
              value: {{ .Values.monitor.memoryLimitBytes | default 4294967296 | quote }}
            - name: INTERVAL_SEC
              value: {{ .Values.monitor.intervalSec | default 2 | quote }}
            - name: RETENTION_DAYS
              value: {{ .Values.monitor.retentionDays | default 30 | quote }}
            - name: LOG_DIR
              value: {{ .Values.monitor.logDir | default "/tmp/monitor" | quote }}
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: k8s-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            - name: monitor-data
              mountPath: {{ .Values.monitor.logDir | default "/tmp/monitor" }}
            - name: sidecar-config
              mountPath: /config/sidecar
              readOnly: true
        {{- end }}
        {{- if or .Values.sidecars.always .Values.backup.enabled }}
        - name: backup-sidecar
          image: "{{ .Values.backup.image.repository }}:{{ .Values.backup.image.tag }}"
          imagePullPolicy: {{ .Values.backup.image.pullPolicy }}
          env:
            - name: LOG_DIR
              value: {{ .Values.backup.logDir | default "/tmp/backup" | quote }}
            - name: RCLONE_CONFIG
              value: /config/rclone.conf
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: rclone-config
              mountPath: /config
              readOnly: true
            - name: backup-data
              mountPath: {{ .Values.backup.logDir | default "/tmp/backup" }}
            - name: sidecar-config
              mountPath: /config/sidecar
              readOnly: true
            {{- range .Values.volumeMounts }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
              {{- if .subPath }}
              subPath: {{ .subPath }}
              {{- end }}
              readOnly: true
            {{- end }}
        {{- end }}
      volumes:
        {{- if .Values.persistence.enabled }}
        {{- $claimName := .Values.persistence.claimName | default .Values.mainVolume.claimName }}
        {{- if $claimName }}
        - name: workspace-volume
          persistentVolumeClaim:
            claimName: {{ $claimName }}
        {{- end }}
        {{- end }}
        {{- if or .Values.sidecars.always .Values.monitor.enabled }}
        - name: k8s-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        apiVersion: v1
                        fieldPath: metadata.namespace
        {{- end }}
        {{- if or .Values.sidecars.always .Values.monitor.enabled }}
        - name: monitor-data
          emptyDir: {}
        {{- end }}
        {{- if or .Values.sidecars.always .Values.backup.enabled }}
        - name: rclone-config
          secret:
            secretName: {{ .Values.backup.secretName | default "placeholder-backup-secret" }}
            optional: true
            items:
              - key: rclone.conf
                path: rclone.conf
        - name: backup-data
          emptyDir: {}
        {{- end }}
        {{- if .Values.sidecars.always }}
        - name: sidecar-config
          configMap:
            name: {{ include "codehub.fullname" . }}-sidecar-config
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
